<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 920 520">
<title>Worst concurrent transaction latency</title>
<desc>Median of the maximum transaction latency in each run for EliteSQL and SQLite with one, two, four and eight concurrent writers.</desc>
<style>
          :root { color-scheme: light dark; }
          .title { font: 600 22px system-ui, sans-serif; fill: #1f2328; }
          .subtitle, .axis-label, .tick, .value, .legend { font-family: system-ui, sans-serif; fill: #57606a; }
          .subtitle { font-size: 13px; }
          .axis-label { font-size: 13px; font-weight: 600; }
          .tick, .legend { font-size: 12px; }
          .value { font-size: 11px; font-weight: 600; }
          .grid { stroke: #d0d7de; stroke-width: 1; }
          .axis { stroke: #8c959f; stroke-width: 1.25; }
          .series { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
          .point { stroke: Canvas; stroke-width: 2; }
          @media (prefers-color-scheme: dark) {
            .title { fill: #f0f6fc; }
            .subtitle, .axis-label, .tick, .value, .legend { fill: #b1bac4; }
            .grid { stroke: #30363d; }
            .axis { stroke: #6e7681; }
          }
        </style>
<text class="title" x="88" y="32">Worst concurrent transaction latency</text>
<text class="subtitle" x="88" y="55">200,000 total rows · 10 rows/transaction · 3 runs · median · fast</text>
