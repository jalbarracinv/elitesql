[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clawdb"
version = "0.0.1"
description = "ClawDB Python binding: embedded (ctypes over libclawdb) and sidecar client"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
keywords = ["database", "embedded", "vector-search", "full-text"]

[tool.setuptools]
py-modules = ["clawdb"]
