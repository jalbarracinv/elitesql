[package]
name = "clawdb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ClawDB command line: query/repl, check, repair, import/export and sidecar server"

[[bin]]
name = "clawdb"
path = "src/main.rs"

[dependencies]
clawdb-core = { path = "../clawdb-core" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
