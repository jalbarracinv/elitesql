[package]
name = "elitesql-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EliteSQL storage engine core: MVCC, WAL, SQL minimo y busqueda vectorial nativa"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
crc32fast = "1"
memmap2 = "0.9"
parking_lot = "0.12"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tempfile = "3"

[[bench]]
name = "vs_sqlite"
harness = false

[[bench]]
name = "scale_vs_sqlite"
harness = false

[[bench]]
name = "concurrent_writers"
harness = false

[[bench]]
name = "sql"
harness = false

[[bench]]
name = "vector"
harness = false
